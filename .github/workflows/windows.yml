name: Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests PySide6 pyttsx3 SpeechRecognition keyring pypdf python-docx pytest pyinstaller
      - name: Tests (incl. GUI smoke test on real Windows + PySide6)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: python -m pytest -q tests --junitxml=junit.xml || { python ../.github/scripts/annotate.py junit junit.xml; exit 1; }
      - name: Build executable
        shell: bash
        run: pyinstaller --noconfirm jarvis_desktop.spec 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0 || { python ../.github/scripts/annotate.py log build.log; exit 1; }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/JarvisDesktop/* -DestinationPath ../JarvisDesktop-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisDesktop-windows
          path: JarvisDesktop-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JarvisDesktop-windows.zip
