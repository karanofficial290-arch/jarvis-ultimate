name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend + desktop agent + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx
      - name: Run all Python tests
        run: python -m pytest -q backend/tests desktop/tests tests
