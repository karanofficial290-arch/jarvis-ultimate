name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ../gradle-test.log; test ${PIPESTATUS[0]} -eq 0 || { python3 ../.github/scripts/annotate.py log ../gradle-test.log; exit 1; }
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee ../gradle-build.log; test ${PIPESTATUS[0]} -eq 0 || { python3 ../.github/scripts/annotate.py log ../gradle-build.log; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../JarvisUltimate-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisUltimate-android-apk
          path: JarvisUltimate-debug.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JarvisUltimate-debug.apk
