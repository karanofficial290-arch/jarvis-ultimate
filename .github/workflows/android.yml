name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ../gradle-test.log; test ${PIPESTATUS[0]} -eq 0 || { python3 ../.github/scripts/annotate.py junit $(find app/build/test-results -name '*.xml'); python3 ../.github/scripts/annotate.py log ../gradle-test.log; exit 1; }
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee ../gradle-build.log; test ${PIPESTATUS[0]} -eq 0 || { python3 ../.github/scripts/annotate.py log ../gradle-build.log; exit 1; }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../JarvisUltimate-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisUltimate-android-apk
          path: JarvisUltimate-debug.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JarvisUltimate-debug.apk

  emulator-test:
    name: Run the app on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK on emulator and run UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest > ../emu.log 2>&1 || (tail -60 ../emu.log; python3 ../.github/scripts/annotate.py junit $(find app/build/outputs/androidTest-results -name "*.xml") ; python3 ../.github/scripts/annotate.py log ../emu.log; exit 1)
